name: Update VPN ru domains

on:
  push:
    paths:
      - custom_ru_domains.txt

  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download and merge domains
        run: |
          curl -fsSL "https://russia.iplist.opencck.org/?format=text&data=domains" -o ru_domains_opencck.txt

          cat ru_domains_opencck.txt custom_ru_domains.txt \
            | sed 's/\r$//' \
            | sed '/^\s*$/d' \
            | sed '/^\s*#/d' \
            | tr '[:upper:]' '[:lower:]' \
            | sort -u \
            > ru_domains.txt

      - name: Commit updated ru ru_domains.txt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add ru_domains.txt
          git diff --cached --quiet || git commit -m "Update domains list"
          git push
