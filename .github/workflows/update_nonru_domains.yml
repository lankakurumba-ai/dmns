name: Update non-RU VPN domains

on:
  push:
    paths:
      - custom_nonru_domains.txt

  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download and merge domains
        run: |
          curl -fsSL "https://iplist.opencck.org/?format=text&data=domains&site=claude.ai&site=chatgpt.com&site=youtube.com&site=miro.com&site=telegram.org&site=netflix.com&site=medium.com&site=instagram.com&site=linkedin.com&site=x.com&site=4pda.to&site=meduza.io&site=filmitorrent.net&site=rutor.info&site=rutracker.org&site=whatsapp.com" -o nonru_domains_opencck.txt
          curl -fsSL "https://iplist.opencck.org/?format=text&data=cidr4&site=claude.ai&site=chatgpt.com&site=youtube.com&site=miro.com&site=telegram.org&site=netflix.com&site=medium.com&site=instagram.com&site=linkedin.com&site=x.com&site=4pda.to&site=meduza.io&site=filmitorrent.net&site=rutor.info&site=rutracker.org&site=whatsapp.com" -o nonru_cidr4_opencck.txt
          curl -fsSL "https://iplist.opencck.org/?format=text&data=cidr6&site=claude.ai&site=chatgpt.com&site=youtube.com&site=miro.com&site=telegram.org&site=netflix.com&site=medium.com&site=instagram.com&site=linkedin.com&site=x.com&site=4pda.to&site=meduza.io&site=filmitorrent.net&site=rutor.info&site=rutracker.org&site=whatsapp.com" -o nonru_cidr6_opencck.txt

          cat nonru_domains_opencck.txt nonru_cidr4_opencck.txt nonru_cidr6_opencck.txt custom_nonru_domains.txt \
            | sed 's/\r$//' \
            | sed '/^\s*$/d' \
            | sed '/^\s*#/d' \
            | tr '[:upper:]' '[:lower:]' \
            | sort -u \
            > nonru_domains.txt

      - name: Commit updated nonru_domains.txt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add nonru_domains.txt
          git diff --cached --quiet || git commit -m "Update nonru_domains list"
          git push
